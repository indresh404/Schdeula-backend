version: "3.9"

# ─────────────────────────────────────────────────────────────────
#  Schedula — Docker Compose Configuration
#
#  Quick Start:
#    Double-click start-docker.bat
#    OR run: docker compose up --build -d
#
#  Stop:
#    Double-click stop-docker.bat
#    OR run: docker compose down
# ─────────────────────────────────────────────────────────────────

services:
  schedula:
    build:
      context: .
      dockerfile: Dockerfile
    image: schedula:latest
    container_name: schedula_app

    ports:
      - "${PORT:-5000}:5000"

    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY:-schedula_cmpn_2026_secret_key}

    # Bind mount data directory to persist timetables, faculty, and settings on host
    volumes:
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/timetable"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
