version: "3.9"

# ─────────────────────────────────────────────────────────────────
#  Schedula — docker-compose.yml
#  Usage:
#    docker compose up --build        # first run / rebuild
#    docker compose up -d             # start in background
#    docker compose down              # stop & remove containers
#    docker compose logs -f           # follow logs
# ─────────────────────────────────────────────────────────────────

services:
  schedula:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: schedula:latest
    container_name: schedula_app

    # ── Port mapping ─────────────────────────────────────────────
    ports:
      - "${SCHEDULA_PORT:-5000}:5000"

    # ── Environment ──────────────────────────────────────────────
    environment:
      HOST:         "0.0.0.0"
      PORT:         "5000"
      FLASK_DEBUG:  "${FLASK_DEBUG:-0}"
      SECRET_KEY:   "${SECRET_KEY:-schedula_secret_please_change_me}"

    # ── Persistent data volume ───────────────────────────────────
    # All JSON data files, timetable, settings, faculty, rooms, etc.
    # survive container restarts / image rebuilds.
    volumes:
      - schedula_data:/app/data

    # ── Health & restart ─────────────────────────────────────────
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/timetable')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # ── Logging ──────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Named volume (data persists between rebuilds) ─────────────────
volumes:
  schedula_data:
    name: schedula_data
